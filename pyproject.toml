[project]
name = "localinteractiveairesponder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sidthefaker", email = "sidthefaker@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
localinteractiveairesponder = "localinteractiveairesponder:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

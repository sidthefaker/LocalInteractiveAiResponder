<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Interactive AI Responder</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4" integrity="sha384-A986SAtodyH8eg8x8irJnYUk7i9inVQqYigD6qZ9evobksGNIXfeFvDwLSHcp31N" crossorigin="anonymous"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; }
      textarea { box-sizing: border-box; min-height: 7rem; width: 100%; }
      button { margin-top: .5rem; padding: .5rem 1rem; }
      #chat-messages { border: 1px solid #bbb; margin-top: 1rem; min-height: 8rem; padding: 1rem; }
      .chat-turn { border-bottom: 1px solid #ddd; padding: .5rem 0; }
      .user-message { font-weight: 600; white-space: pre-wrap; }
      .echo-line { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>로컬 AI 채팅</h1>
      <p>현재는 응답 인터페이스를 확인하기 위해 입력 문구를 에코합니다.</p>
      <form hx-post="/chat" hx-target="#chat-messages" hx-swap="beforeend">
        <label for="message">메시지</label>
        <textarea id="message" name="message" maxlength="2000" required></textarea>
        <button type="submit">보내기</button>
      </form>
      <section id="chat-messages" aria-live="polite">대화를 시작해보세요.</section>
    </main>
  </body>
</html>
